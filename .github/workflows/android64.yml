name: Build Input Buffer Android64

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build-android64:
    name: Build Android64 (.geode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build for Android64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: given
          android-min-sdk: 23

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v7
        with:
          name: Lyoph-Input-Buffer-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
